[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-filings"
version = "0.2.0"
description = "SEC ingestion foundations alongside legacy local filing workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pyarrow>=15",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
finbot-filings = "finbot_filings.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finbot_filings*", "finbot_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
