[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-filings"
version = "0.2.0"
description = "Restart-safe SEC document acquisition and artifact publication service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.110,<2",
    "beautifulsoup4>=4.12,<5",
    "requests>=2.32,<3",
    "exchange-calendars>=4.13.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finbot_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["container: opt-in Docker lifecycle tests (FINBOT_CONTAINER_TESTS=1)"]
