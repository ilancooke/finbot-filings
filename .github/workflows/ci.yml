name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Application and infrastructure checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m compileall -q src tests scripts
          .venv/bin/python -m pytest -q
          .venv/bin/python -m build
          python -m venv infra/cdk/.venv
          infra/cdk/.venv/bin/python -m pip install -r infra/cdk/requirements-dev.txt
          infra/cdk/.venv/bin/python -m pytest -q infra/cdk/tests
          npm ci --ignore-scripts --no-audit --no-fund
          npm run synth -- --no-lookups
          git diff --check
      - name: Validate workflows
        run: |
          .venv/bin/python scripts/install_actionlint.py "$RUNNER_TEMP/finbot-tools"
          "$RUNNER_TEMP/finbot-tools/actionlint" -shellcheck= -pyflakes=
      - name: Target image and offline lifecycle
        run: |
          docker build --platform linux/arm64 --provenance=false -t finbot-ingestion:ci .
          test "$(docker image inspect finbot-ingestion:ci --format '{{.Architecture}}')" = arm64
          FINBOT_CONTAINER_TESTS=1 FINBOT_CONTAINER_IMAGE=finbot-ingestion:ci .venv/bin/python -m pytest -q tests/integration/test_phase7.py -m container
          .venv/bin/python scripts/check_heartbeat_volume.py finbot-ingestion:ci
