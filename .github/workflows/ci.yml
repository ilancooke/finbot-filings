name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate:
        description: 'Explicitly start a stopped service after production-readiness approval'
        type: boolean
        default: false
      image_digest:
        description: 'Optional existing validated compatible ARM64 digest for rollback/activation'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
      image_artifact: ${{ steps.exported_image.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Application and infrastructure checks
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m compileall -q src tests scripts
          .venv/bin/python -m pytest -q
          .venv/bin/python -m build
          python -m venv infra/cdk/.venv
          infra/cdk/.venv/bin/python -m pip install -r infra/cdk/requirements-dev.txt
          infra/cdk/.venv/bin/python -m pytest -q infra/cdk/tests
          npm ci --ignore-scripts --no-audit --no-fund
          npm run synth -- --no-lookups
          git diff --check
      - name: Validate workflows
        run: |
          .venv/bin/python scripts/install_actionlint.py "$RUNNER_TEMP/finbot-tools"
          "$RUNNER_TEMP/finbot-tools/actionlint" -shellcheck= -pyflakes=
      - name: Target image and offline lifecycle
        id: image
        run: |
          docker build --platform linux/arm64 --provenance=false -t finbot-ingestion:ci .
          test "$(docker image inspect finbot-ingestion:ci --format '{{.Architecture}}')" = arm64
          FINBOT_CONTAINER_TESTS=1 FINBOT_CONTAINER_IMAGE=finbot-ingestion:ci .venv/bin/python -m pytest -q tests/integration/test_container_lifecycle.py -m container
          .venv/bin/python scripts/check_heartbeat_volume.py finbot-ingestion:ci
          echo "image_id=$(docker image inspect finbot-ingestion:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Export tested image
        id: exported_image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FINBOT_DELIVERY_ENABLED == 'true' && inputs.image_digest == ''
        run: |
          docker save finbot-ingestion:ci --output "$RUNNER_TEMP/ingestion-image.tar"
          echo "artifact_name=tested-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain tested image for this run
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FINBOT_DELIVERY_ENABLED == 'true' && inputs.image_digest == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.exported_image.outputs.artifact_name }}
          path: ${{ runner.temp }}/ingestion-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  release:
    needs: validate
    if: >-
      vars.FINBOT_DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    concurrency:
      group: finbot-ingestion-production-delivery
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FINBOT_CLUSTER: ${{ vars.FINBOT_CLUSTER }}
      FINBOT_SERVICE: ${{ vars.FINBOT_SERVICE }}
      FINBOT_REPOSITORY_URI: ${{ vars.FINBOT_REPOSITORY_URI }}
      FINBOT_BASELINE: ${{ vars.FINBOT_BASELINE_TASK_DEFINITION }}
      FINBOT_ACTIVATION_APPROVED: ${{ vars.FINBOT_ACTIVATION_APPROVED }}
      RELEASE_COMMIT: ${{ github.sha }}
      TESTED_IMAGE_ID: ${{ needs.validate.outputs.image_id }}
      ROLLBACK_DIGEST: ${{ inputs.image_digest }}
      ACTIVATE: ${{ inputs.activate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install .
      - name: Retrieve this run's tested image
        if: env.ROLLBACK_DIGEST == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.image_artifact }}
          path: ${{ runner.temp }}/tested-image
      - name: Load tested image
        if: env.ROLLBACK_DIGEST == ''
        run: docker load --input "$RUNNER_TEMP/tested-image/ingestion-image.tar"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.FINBOT_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: finbot-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Publish tested image and perform controlled handoff
        run: .venv/bin/python scripts/release.py --github
      - name: Preserve release checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: ignore
          retention-days: 30
